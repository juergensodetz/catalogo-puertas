<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Puerta 3D</title>
  <!-- Script oficial de Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #f5f5f5; }
    model-viewer { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <!-- Visor interactivo y botón de Realidad Aumentada -->
  <model-viewer 
    src="puerta.glb" 
    alt="Modelo 3D de Puerta" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1">
  </model-viewer>

</body>
</html>
